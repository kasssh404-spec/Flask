    <style>
        /* --- USER'S ORIGINAL EXACT CSS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;

        header {

        .blog-hero {

        .lens-flare {

            background: radial-gradient(circle, rgba(135,206,250,0.6) 0%, rgba(0,191,255,0.15) 40%, transparent 70%);

        .hero-content { max-width: 800px; position: relative; z-index: 2; }

        .read-more-btn {

        .container {

        .feed-title {
            font-size: 1.5rem;
            margin-bottom: 30px;
            letter-spacing: 1px;

            padding-left: 15px;

        .article-card {
            background: rgba(11, 19, 41, 0.4);
            border: 1px solid rgba(0, 191, 255, 0.15);

            margin-bottom: 30px;

        .article-card:hover { border-color: rgba(0, 191, 255, 0.6); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,191,255,0.1); }
        .article-meta { font-size: 0.8rem; color: #93c5fd; margin-bottom: 10px; letter-spacing: 1px; display: flex; justify-content: space-between; }

        .sidebar-widget {

        .sidebar-widget h4 {

            padding-bottom: 8px;

        .sidebar-widget p { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; margin-bottom: 15px; }

        .newsletter-input {
            width: 100%;
            background: #030712;
            border: 1px solid rgba(0, 191, 255, 0.3);
            padding: 10px;

        .newsletter-input:focus { outline: none; border-color: #00bfff; box-shadow: 0 0 10px rgba(0,191,255,0.3); }

        .newsletter-btn {

            border: none;
            padding: 10px;

            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;

        }
        .newsletter-btn:hover { background: #ff3366; color: #fff; box-shadow: 0 0 15px rgba(255,51,102,0.6); }

        .category-list { list-style: none; }
        .category-list li { margin-bottom: 10px; }
        .category-list button { background: none; border: none; color: #cbd5e1; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; cursor: pointer; transition: color 0.3s ease; }
        .category-list button:hover { color: #00bfff; }

        /* --- NEW INTEGRATION CSS --- */
        
        /* Top Utility Bar */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 28px;
            background: #02040a; border-bottom: 1px solid rgba(0, 191, 255, 0.2);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; font-size: 0.75rem; z-index: 1001; color: #94a3b8;
        }

        /* Header Login Inputs */
        .login-wrap { display: flex; align-items: center; gap: 10px; margin-left: 25px; }
        .login-input {
            background: #030712; border: 1px solid rgba(0,191,255,0.3); color: #fff;
            padding: 4px 8px; font-family: 'Courier New', Courier, monospace; font-size: 0.75rem; width: 90px;
        }
        .login-input:focus { outline: none; border-color: #00bfff; }
        .login-input.error { border-color: #ff3366; animation: shake 0.4s; }
        
        .login-btn {
            background: #00bfff; color: #030712; border: none; padding: 5px 12px;

        @keyframes shake {

        /* Embed Elements */

        iframe { width: 100%; border: none; background: #000; }

        /* Admin Table */
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .admin-table th { text-align: left; padding: 10px; color: #00bfff; border-bottom: 1px solid rgba(0,191,255,0.3); }
        .admin-table td { padding: 10px; border-bottom: 1px solid rgba(0,191,255,0.1); color: #cbd5e1; }

        /* Professional Footer */
        footer {
            border-top: 1px solid rgba(0, 191, 255, 0.2);

        }
        .footer-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 40px;
            max-width: 1200px; margin: 0 auto 30px auto;
        }
        .footer-col h4 { color: #fff; border-bottom: 1px solid rgba(0,191,255,0.2); padding-bottom: 10px; margin-bottom: 15px; }
        .stat-box { background: rgba(0,191,255,0.05); border: 1px solid rgba(0,191,255,0.2); padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; }

        ::-webkit-scrollbar { width: 6px; }

        ::-webkit-scrollbar-thumb:hover { background: #00bfff; }

<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- AUTHENTICATION & ROLES ---
        const VALID_CREDENTIALS = [
            { uid: 'root', pass: 'admin123', role: 'SUPER_ADMIN', name: 'Root_Operator' },
            { uid: 'mod', pass: 'mod123', role: 'MODERATOR', name: 'Sentinel_Mod' },
            { uid: 'creator', pass: 'art123', role: 'CREATOR', name: 'Data_Creator' },
            { uid: 'user', pass: 'user123', role: 'USER', name: 'Terminal_User' }
        ];

        const ROLES = {
            SUPER_ADMIN: { color: '#ff3366', permissions: ['ALL', 'ADMIN_PANEL', 'MODERATION', 'USER_MGMT', 'SYSTEM_LOGS', 'AI_STUDIO', 'BROADCAST'] },
            MODERATOR: { color: '#00bfff', permissions: ['ADMIN_PANEL', 'MODERATION', 'SYSTEM_LOGS', 'BROADCAST'] },
            CREATOR: { color: '#93c5fd', permissions: ['AI_STUDIO', 'BROADCAST', 'VAULT_WRITE'] },
            USER: { color: '#cbd5e1', permissions: ['BROADCAST'] },
            GUEST: { color: '#64748b', permissions: ['READ_ONLY'] }
        };

        // --- MEDIA PARSER ---
        const parseMediaLinks = (text) => {
            if (!text) return [];
            const media = [];
            const ytPlaylistRegex = /(?:https?:\/\/)?(?:www\.)?youtube\.com\/playlist\?list=([\w-]+)/gi;
            const ytVideoRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([\w-]{11})/gi;
            const spotifyRegex = /(?:https?:\/\/)?open\.spotify\.com\/(track|playlist|album)\/([a-zA-Z0-9]+)/gi;
            const soundcloudRegex = /(?:https?:\/\/)?(?:www\.)?soundcloud\.com\/[a-zA-Z0-9-_]+\/(?:sets\/[a-zA-Z0-9-_]+|[a-zA-Z0-9-_]+)/gi;
            const mixcloudRegex = /(?:https?:\/\/)?(?:www\.)?mixcloud\.com\/[a-zA-Z0-9-_]+\/[a-zA-Z0-9-_]+\//gi;
            const imageRegex = /(https?:\/\/.*\.(?:png|jpg|jpeg|gif|webp)|https?:\/\/images\.unsplash\.com\/[^\s]+)/gi;

            let match;
            while ((match = ytPlaylistRegex.exec(text)) !== null) media.push({ type: 'youtube', url: match[0], embed: `https://www.youtube.com/embed/videoseries?list=${match[1]}` });
            while ((match = ytVideoRegex.exec(text)) !== null) if (!media.some(m => m.url === match[0])) media.push({ type: 'youtube', url: match[0], embed: `https://www.youtube.com/embed/${match[1]}` });
            while ((match = spotifyRegex.exec(text)) !== null) media.push({ type: 'spotify', mediaType: match[1], url: match[0], embed: `https://open.spotify.com/embed/${match[1]}/${match[2]}` });
            while ((match = soundcloudRegex.exec(text)) !== null) {
                const isPl = match[0].includes('/sets/');
                media.push({ type: 'soundcloud', isPl, url: match[0], embed: `https://w.soundcloud.com/player/?url=${encodeURIComponent(match[0])}&color=%2300bfff&auto_play=false&hide_related=true&show_comments=true&visual=${isPl ? 'true' : 'false'}` });
            }
            while ((match = mixcloudRegex.exec(text)) !== null) media.push({ type: 'mixcloud', url: match[0], embed: `https://www.mixcloud.com/widget/iframe/?hide_cover=1&feed=${encodeURIComponent(match[0])}` });
            while ((match = imageRegex.exec(text)) !== null) media.push({ type: 'image', url: match[0] });

            return media;
        };

        // --- MOCK DATABASE ---
        const INITIAL_POSTS = [
            { id: 1, meta: "SYS_LOG // March 28, 2026", title: "The Architecture of Anonymous Networks", author: "Root_Operator", role: "SUPER_ADMIN", content: "An exploratory look into how routing layers, onion encryption, and zero-knowledge systems preserve operational privacy when interacting with public-facing database endpoints.\n\nDemonstration Audio Stream:\nhttps://soundcloud.com/nd_madeit/lofi-chill", likes: 42, comments: 8 },
            { id: 2, meta: "SECURITY // March 15, 2026", title: "Bypassing the Default Filter Bubble", author: "Data_Creator", role: "CREATOR", content: "Algorithms are tuned to feed confirmation loops. Breaking out requires deliberate friction, alternative protocol layers, and raw, unfiltered data sources.\n\nVideo Demonstration:\nhttps://www.youtube.com/watch?v=LXb3EKWsInQ", likes: 89, comments: 14 }
        ];

        // --- MAIN COMPONENT ---
        const App = () => {
            // Core State
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentRoleKey, setCurrentRoleKey] = useState('GUEST');
            const [currentUserName, setCurrentUserName] = useState('');
            const [activeTab, setActiveTab] = useState('articles');
            const [adminTab, setAdminTab] = useState('moderation');
            
            // Login Forms
            const [loginKey, setLoginKey] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [authError, setAuthError] = useState(false);

            // Metrics & IP Tracking
            const [visitCount, setVisitCount] = useState(0);
            const [sessionIp, setSessionIp] = useState('Detecting...');

            // App Data
            const [posts, setPosts] = useState(INITIAL_POSTS);
            const [users, setUsers] = useState([
                { id: 'u_1', name: 'Root_Operator', role: 'SUPER_ADMIN', status: 'Active', ip: '192.168.1.45' },
                { id: 'u_2', name: 'Null_Node', role: 'USER', status: 'Flagged', ip: '185.220.101.5' }
            ]);
            const [modQueue, setModQueue] = useState([
                { id: 'mod_1', user: 'Null_Node', reason: 'Unverified External Route', content: 'Injected test URL https://soundcloud.com/sample/track' }
            ]);
            const [logs, setLogs] = useState([{ id: 'log_0', type: 'SYSTEM', msg: 'Core initialized.', time: new Date().toLocaleTimeString() }]);
            const [vault, setVault] = useState([]);

            // Editor States
            const [postTitle, setPostTitle] = useState('');
            const [postContent, setPostContent] = useState('');
            const [studioPrompt, setStudioPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [studioResult, setStudioResult] = useState(null);

            // --- 24H VISIT & IP TRACKER LOGIC ---
            useEffect(() => {
                const ONE_DAY_MS = 24 * 60 * 60 * 1000;
                let storedVisits = parseInt(localStorage.getItem('dl_visits') || '84902', 10);
                const lastVisitTime = parseInt(localStorage.getItem('dl_last_visit') || '0', 10);
                let currentIp = localStorage.getItem('dl_ip');

                if (!currentIp) {
                    currentIp = `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
                    localStorage.setItem('dl_ip', currentIp);
                }
                setSessionIp(currentIp);

                const now = Date.now();
                if (now - lastVisitTime > ONE_DAY_MS) {
                    storedVisits += 1;
                    localStorage.setItem('dl_visits', storedVisits.toString());
                    localStorage.setItem('dl_last_visit', now.toString());
                    addLog('ANALYTICS', `Unique connection logged: ${currentIp}`, 'INFO');
                }
                setVisitCount(storedVisits);
            }, []);

            const currentRole = ROLES[currentRoleKey];
            const hasPermission = (perm) => {
                if (!isLoggedIn) return perm === 'READ_ONLY';
                if (currentRole.permissions.includes('ALL')) return true;
                return currentRole.permissions.includes(perm);
            };

            const addLog = (type, msg) => {
                setLogs(prev => [{ id: 'log_' + Date.now(), type, msg, time: new Date().toLocaleTimeString() }, ...prev]);
            };

            // Authentication Handlers
            const handleLogin = (e) => {
                e.preventDefault();
                setAuthError(false);
                const valid = VALID_CREDENTIALS.find(u => u.uid === loginKey && u.pass === loginPass);
                
                if (valid) {
                    setIsLoggedIn(true);
                    setCurrentRoleKey(valid.role);
                    setCurrentUserName(valid.name);
                    setLoginKey(''); setLoginPass('');
                    addLog('SECURITY', `Auth Success: ${valid.uid} [${valid.role}]`);
                } else {
                    setAuthError(true);
                    addLog('SECURITY', `Auth Failed: Invalid credentials for UID ${loginKey}`);
                    setTimeout(() => setAuthError(false), 500);
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false); setCurrentRoleKey('GUEST'); setCurrentUserName('');
                setActiveTab('articles');
                addLog('SECURITY', `Session terminated.`);
            };

            // Content Handlers
            const handlePost = (e) => {
                e.preventDefault();
                if (!postContent.trim()) return;
                setPosts([{
                    id: Date.now(), meta: `DISPATCH // ${new Date().toLocaleDateString()}`,
                    title: postTitle || "Untitled Dispatch", author: currentUserName, role: currentRoleKey,
                    content: postContent, likes: 0, comments: 0
                }, ...posts]);
                setPostTitle(''); setPostContent('');
                addLog('DISPATCH', `Broadcast by ${currentUserName}`);
            };

            const handleAI = () => {
                if (!studioPrompt) return;
                setIsGenerating(true); setStudioResult(null);
                setTimeout(() => {
                    setIsGenerating(false);
                    setStudioResult({ id: Date.now(), url: `https://images.unsplash.com/photo-${1600000000000 + Math.floor(Math.random()*9999999)}?q=80&w=800`, prompt: studioPrompt, time: new Date().toLocaleTimeString() });
                    addLog('STUDIO', `Asset rendered: "${studioPrompt.substring(0,20)}..."`);
                }, 2000);
            };

            return (
                <div>
                    {/* TOP STATUS BAR */}
                    <div className="top-bar">
                        <div>NETWORK STATUS: <span className="text-[#00bfff]">ONLINE</span></div>
                        <div>NODE: US_EAST // LATENCY: <span className="text-[#00bfff]">14ms</span></div>
                    </div>

                    {/* MAIN HEADER */}
                    <header>
                        <a href="#" onClick={() => setActiveTab('articles')} className="logo">
                            <i data-lucide="terminal"></i> dont.likes<span>yOu</span>.org
                        </a>
                        
                        <nav>
                            <button onClick={() => setActiveTab('articles')} className={activeTab === 'articles' ? 'active' : ''}>Articles</button>
                            {hasPermission('AI_STUDIO') && <button onClick={() => setActiveTab('studio')} className={activeTab === 'studio' ? 'active' : ''}>Studio</button>}
                            {hasPermission('ADMIN_PANEL') && <button onClick={() => setActiveTab('admin')} className={activeTab === 'admin' ? 'active' : ''}>Terminal <span className="text-[#ff3366]">[{modQueue.length}]</span></button>}
                            <button onClick={() => setActiveTab('vault')} className={activeTab === 'vault' ? 'active' : ''}>Vault</button>
                            <button onClick={() => setActiveTab('analytics')} className={activeTab === 'analytics' ? 'active' : ''}>Metrics</button>

                            {/* LOGIN MODULE IN HEADER */}
                            <div className="login-wrap">
                                {isLoggedIn ? (
                                    <>
                                        <span className="text-[11px] text-[#00bfff] font-bold">[{currentRole.name}]</span>
                                        <button onClick={handleLogout} className="login-btn !bg-[#ff3366] !text-[#fff]">LOGOUT</button>
                                    </>
                                ) : (
                                    <form onSubmit={handleLogin} style={{display:'flex', gap:'5px'}}>
                                        <input type="text" placeholder="UID" value={loginKey} onChange={e=>setLoginKey(e.target.value)} className={`login-input ${authError ? 'error' : ''}`} required />
                                        <input type="password" placeholder="PASS" value={loginPass} onChange={e=>setLoginPass(e.target.value)} className={`login-input ${authError ? 'error' : ''}`} required />
                                        <button type="submit" className="login-btn">AUTH</button>
                                    </form>
                                )}
                            </div>
                        </nav>
                    </header>

                    {/* HERO SECTION */}
                    {activeTab === 'articles' && (
                        <section className="blog-hero">
                            <div className="lens-flare"></div>
                            <div className="hero-content">
                                <div className="hero-tag">Featured Dispatch // {new Date().toLocaleDateString()}</div>
                                <h1 className="hero-title">Decoding the Noise: Why Truth Hits Different in the Digital Age</h1>
                                <p className="hero-excerpt">Modern systems are built on sanitized narratives and automated consensus. Dive deep into the underlying code of information distribution, decentralized transparency, and the protocols shaping the next era of truth verification.</p>
                                <button onClick={() => window.scrollTo(0, 500)} className="read-more-btn">Read Transmissions</button>
                            </div>
                        </section>
                    )}

                    {/* MAIN LAYOUT */}
                    <div className="container" style={{ paddingTop: activeTab !== 'articles' ? '120px' : '60px' }}>
                        
                        <main>
                            <AnimatePresence mode="wait">
                                
                                {/* 1. FEED / ARTICLES */}
                                {activeTab === 'articles' && (
                                    <motion.div key="feed" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                                        <h2 className="feed-title">
                                            <span>Latest Dispatches</span>
                                            <span style={{fontSize:'0.8rem', color:'#93c5fd'}}>{posts.length} TRANSMISSIONS</span>
                                        </h2>

                                        {hasPermission('BROADCAST') && (
